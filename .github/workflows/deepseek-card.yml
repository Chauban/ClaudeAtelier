# DeepSeek 生卡。
#
# 分成两段 job，凭据严格隔离：
#   generate —— 跑模型写的渲染代码，**没有任何 git 凭据、没有写权限**
#   publish  —— 只跑仓库自有代码，才拿 contents:write
#
# generate 那步的 persist-credentials: false 是这里最要紧的一行：
# 否则 actions/checkout 会把带 GITHUB_TOKEN 的 auth header 写进 .git/config，
# 而模型写的代码就在同一台 VM 上跑 —— 那是外泄路径。
#
# 失败会开 issue 告警（见文件末尾的 notify）—— 这个项目的教训是失败无声。
name: deepseek-card

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成不发布"
        type: boolean
        default: false
      force_style:
        description: "指定风格 S（留空则按规则抽取）"
        type: string
        default: ""
  # 这两条 cron 现在是**兜底**，不是主触发器。
  #
  # 准点由本机的计划任务 ClaudeAtelier-Trigger-Flash 负责：它到点跑
  # trigger-cards.bat，发一个 workflow_dispatch，实测 5~10 秒进 runner。
  # schedule 事件走的是 GitHub 明说「高负载时延迟、不保证」的共享队列 ——
  # 2026-08-12 抽查 7 次 schedule 触发，全部迟到，47 分钟到 2h33m。
  # 计算仍然留在这里（见文件头：模型写的渲染代码不上本机），只有时钟搬走了。
  #
  # 留着 cron 是因为本机会睡、会关机、gh 会被登出。那时这两条照常把卡做出来，
  # 只是迟到 —— 也就是退回到有触发器之前的行为。所以触发器失败不停线。
  #
  # 两条路径可能撞在一起（cron 恰好准点 + 触发器也发了），这是安全的：
  # concurrency 组让它们排队而不是并跑，后到的那次被新鲜度守卫判为跳过。
  #
  # 与 Claude 同一网格：UTC */4 == 北京时间 00/04/08/12/16/20（时差 8 是 4 的倍数）。
  # 不错开是项目所有者的决定。附带效果值得知道：K（领域）和 L（语言）都由
  # UTC 小时数推算，时间相同就意味着两家拿到**完全相同的领域和语言** ——
  # 每一班会出现同领域、同语言、不同模型的两张卡，正是「同一道题，不同的手」
  # 最直接的呈现。两家目录、台账、发号完全独立，同时跑不会互相干扰。
  schedule:
    - cron: '0 */4 * * *'     # UTC
    - cron: '40 */4 * * *'    # 补位；新鲜度守卫会让它在正常时空跑

permissions: {}

concurrency:
  group: deepseek-card
  cancel-in-progress: false      # 排队而不是取消：中途被杀会留下没人认领的原图

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.gen.outputs.status }}
    # 实测一张卡端到端最长 1281 秒，加上选题核实要留足余量。绝不能用默认值。
    timeout-minutes: 45
    permissions: {}              # 无写权限、无 token
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false     # ← 关键，见文件头注释

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖与字体
        run: |
          python -m pip install --quiet pillow numpy fonttools ddgs trafilatura zhconv
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra \
                                      fonts-dejavu-core fonts-dejavu-extra
          fc-cache -f > /dev/null

      - name: 字体自检
        # TTC 索引不许硬编码 —— SKILL.md 那组值是 Cowork 沙箱 Debian 构建的，
        # ubuntu-latest 的打包方式不保证一致。这里当场解析并断言覆盖。
        run: python agents/deepseek/fonts.py

      - name: 生成
        id: gen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.force_style }}" ]; then ARGS="$ARGS --force-style ${{ inputs.force_style }}"; fi
          python agents/deepseek/run.py --out out $ARGS
          # 「本班不该出卡」与「本班出卡失败」必须分得开，否则新鲜度跳过
          # 会被 if-no-files-found: error 误判成失败（2026-08-11 就是这么
          # 连挂两次定时班的）。
          echo "status=$(cat out/status.txt 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      # 原图先落袋。丢原图违反「原图必须留在本地」这条第一约束，丢台账行不会。
      # 保留 90 天而不是默认 14：公开仓库 artifact 存储免费，而「电脑关机三周」
      # 会永久毁掉原图。
      - name: 上传原图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-${{ github.run_id }}
          path: out/original/
          retention-days: 90
          if-no-files-found: warn

      - name: 上传发布物
        # published-degraded 也要发：轮次耗尽但画出了图的那一版照常上线，
        # 只是台账 flags 列会写明它仍有未解决的问题。漏了这个状态，降级的卡会被
        # 静默丢掉 —— 而那正好是最值得展出的一批。
        if: steps.gen.outputs.status == 'published' || steps.gen.outputs.status == 'published-degraded' || steps.gen.outputs.status == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: out/publish/
          retention-days: 7
          if-no-files-found: error

      - name: 上传排障材料
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: out/work/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: generate
    # dry_run 时绝不能发布。run.py 在 --dry-run 下**照样**产出 out/publish/
    # （webp、文字副本、row.json 都会生成，只是不写台账），publish job 自己
    # 看不出这是演习 —— 少了这一行，一次「只想试试」的触发会把卡真发上线，
    # 而 web/* 是一年 immutable，发出去就撤不回来。
    if: >-
      inputs.dry_run != true &&
      (needs.generate.outputs.status == 'published' ||
       needs.generate.outputs.status == 'published-degraded')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write            # 仅此处，且这一段只跑仓库自有代码
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: incoming

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 落地并校验提交路径
        run: python agents/deepseek/commit_publish.py --incoming incoming

      - name: 推送
        id: push
        run: |
          git config user.name  "deepseek-card[bot]"
          git config user.email "deepseek-card@users.noreply.github.com"
          git add deepseekv4flash
          python agents/deepseek/commit_publish.py --check-staged --incoming incoming
          if git diff --cached --quiet; then
            echo "没有新内容"; exit 0
          fi
          git commit -q -m "$(cat incoming/commit_msg.txt)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD && exit 0
            echo "推送失败，重试 $i"; sleep 5
          done
          exit 1

  # 失败告警。没有这一段，DeepSeek 那边红了只会体现在 Actions 页面上，
  # 而这个项目的历史教训恰恰是「失败是无声的」—— 2026-08-05 和 08-08
  # 两次卡片积压，都是等人发现网站不更新才知道的。
  # issues:write 只给这一段，且它不执行任何模型产物。
  notify:
    needs: [generate, publish]
    if: always() && (needs.generate.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 开或更新告警 issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          G: ${{ needs.generate.result }}
          P: ${{ needs.publish.result }}
        run: |
          TITLE="deepseek-card 运行失败"
          BODY="$(date -u '+%Y-%m-%d %H:%M UTC')  generate=$G  publish=$P
          $RUN_URL

          排障提示：generate 失败多半是选题核实反复不过、渲染轮次耗尽、
          或搜索被限流（见 out/work 排障 artifact）；publish 失败多半是
          提交路径白名单不匹配或推送冲突。"
          NUM=$(gh issue list --repo "$REPO" --search "$TITLE in:title" \
                  --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
            echo "已在 issue #$NUM 追加评论"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "已新建告警 issue"
          fi
