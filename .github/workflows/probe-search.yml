# Phase 0 探针：在真实 Actions runner 上验证搜索链路是否可用。
#
# 存在的唯一理由：runner 出口是 Azure 共享 IP 段，被爬虫污染严重，
# DuckDuckGo 在本地能用不代表在这里能用。本地测没有意义，必须在这里测。
#
# 手动触发专用，不设 schedule。permissions 全拒——它不碰仓库。
# 验证完即可删除本文件。
name: probe-search

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 出口 IP（判断是否落在被污染的共享段）
        run: curl -s --max-time 20 https://api.ipify.org || echo "(ipify 不可达)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: pip install --quiet ddgs trafilatura requests

      - name: 探测搜索链路
        run: |
          python - <<'PY'
          import time, traceback, urllib.parse, requests

          UA = "ClaudeAtelier-probe/0.1 (+https://github.com/Chauban/ClaudeAtelier)"

          def head(t):
              print("\n" + "=" * 60 + "\n" + t + "\n" + "=" * 60)

          # ---------------------------------------------- 1. DuckDuckGo
          head("1. DuckDuckGo（非官方抓取，最可能被限流的一环）")
          ddg_ok = 0
          queries = [
              "Great Stalacpipe Organ Luray Caverns built",
              "Borwein integral sinc product pi/2",
              "fabella sesamoid bone prevalence 2019",
          ]
          try:
              from ddgs import DDGS
              print("  import: ddgs")
          except ImportError:
              from duckduckgo_search import DDGS
              print("  import: duckduckgo_search（旧名）")

          for q in queries:
              t0 = time.time()
              try:
                  with DDGS() as d:
                      res = list(d.text(q, max_results=5))
                  dt = time.time() - t0
                  ddg_ok += 1 if res else 0
                  print("  [{:>4} {:.1f}s] {} -> {} 条".format(
                      "OK" if res else "空", dt, q[:42], len(res)))
                  if res:
                      print("        {} | {}".format(res[0].get("title","")[:50],
                                                     res[0].get("href","")[:60]))
              except Exception as e:
                  print("  [FAIL {:.1f}s] {} -> {}: {}".format(
                      time.time() - t0, q[:42], type(e).__name__, str(e)[:160]))
              time.sleep(2)
          print("\n  DDG 成功 {}/{}".format(ddg_ok, len(queries)))

          # ---------------------------------------------- 2. Wikipedia
          head("2. Wikipedia REST API（官方、无 key、不该被限流）")
          wiki_ok = 0
          for title in ("Borwein integral", "Great Stalacpipe Organ"):
              try:
                  t0 = time.time()
                  r = requests.get(
                      "https://en.wikipedia.org/api/rest_v1/page/summary/"
                      + urllib.parse.quote(title.replace(" ", "_")),
                      headers={"User-Agent": UA}, timeout=25)
                  print("  [{} {:.1f}s] {} -> {} 字".format(
                      r.status_code, time.time() - t0, title,
                      len(r.json().get("extract", ""))))
                  if r.ok:
                      wiki_ok += 1
                      print("        {}".format(r.json().get("extract","")[:120]))
              except Exception as e:
                  print("  [FAIL] {} -> {}: {}".format(title, type(e).__name__, str(e)[:160]))

          # 全文接口（子串校验要的是正文，不是摘要）
          try:
              r = requests.get("https://en.wikipedia.org/w/api.php",
                               params={"action":"query","prop":"extracts","explaintext":1,
                                       "format":"json","titles":"Borwein integral"},
                               headers={"User-Agent": UA}, timeout=25)
              pg = list(r.json()["query"]["pages"].values())[0]
              print("  [全文 {}] extract 长度 {} 字".format(r.status_code, len(pg.get("extract",""))))
          except Exception as e:
              print("  [全文 FAIL] {}: {}".format(type(e).__name__, str(e)[:160]))

          # ---------------------------------------------- 3. 任意站点抓正文
          head("3. trafilatura 抽正文（verify.py 的子串校验依赖它）")
          for url in ("https://en.wikipedia.org/wiki/Borwein_integral",
                      "https://www.nature.com/articles/35048669"):
              try:
                  import trafilatura
                  t0 = time.time()
                  raw = requests.get(url, headers={"User-Agent": UA}, timeout=25)
                  txt = trafilatura.extract(raw.text) or ""
                  print("  [{} {:.1f}s] {} -> 正文 {} 字".format(
                      raw.status_code, time.time() - t0, url[:52], len(txt)))
                  if txt:
                      print("        {!r}".format(txt[:110]))
              except Exception as e:
                  print("  [FAIL] {} -> {}: {}".format(url[:52], type(e).__name__, str(e)[:160]))

          head("结论")
          print("  DDG   : {}".format("可用" if ddg_ok else "不可用 -> 按 3.7 换 provider"))
          print("  Wiki  : {}".format("可用" if wiki_ok else "不可用（意外，需排查）"))
          PY
